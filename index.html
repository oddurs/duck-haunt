<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05030f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duck Haunt" />
    <meta name="description" content="A spooky NES-style duck shooting game for touch screens." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Duck Haunt</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05030f;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-image: radial-gradient(#1a0e3a 1px, transparent 1px);
        background-size: 6px 6px;
      }
      #game {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game canvas {
        display: block;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        box-shadow: 0 0 0 1px #000, 0 0 40px rgba(104, 68, 252, 0.25);
      }
      noscript {
        color: #fca044;
        font: 16px monospace;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>Duck Haunt needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
